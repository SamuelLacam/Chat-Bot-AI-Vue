services:
  monapp:
    build:
      context: ./app
      target: dev
    image: gizelle-app
    depends_on:
      - db
    ports:
      - "3000:3000"
    networks:
      - monreseau
    environment:
      - COREPACK_ENABLE_DOWNLOAD_PROMPT=0
      # - CHOKIDAR_USEPOLLING=true
      # - CHOKIDAR_INTERVAL=1000
    env_file:
      - .env
    volumes:
      - ./app:/app
      - node_modules:/app/node_modules

  db:
    build: ./db
    image: gizelle-db
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=true
    networks:
      - monreseau

networks:
  monreseau:

volumes:
  node_modules:
